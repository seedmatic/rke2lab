---
apiVersion: cluster.seedmatic.io/v1alpha1
kind: NodeImage
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-workload
  name: nikopol-wrkld-node-base
  namespace: rke2lab-nikopol-wrkld
spec:
  alias: node-base
  buildChecksum: 006375ee65ad175c49d00f05da601da69754fa89f999682485b1f4bba356f0f1
  fingerprint: e55cde891602351fbbc86a48301a76fbaae36af2ff924ed458f9a557e7d82222
  rke2Version: v1.34.10+rke2r1
  runtime:
    kernelModules:
    - ip_vs
    - ip_vs_rr
    - ip_vs_wrr
    - ip_vs_sh
    - netlink_diag
    - nf_nat
    - overlay
    - br_netfilter
    - xt_socket
    - xfrm_user
    - nft_compat
    - xt_mark
    - xt_CT
    - xt_TPROXY
    - xt_comment
    - xt_conntrack
    rawLXC: |-
      lxc.mount.auto = proc:rw sys:rw cgroup:rw
      lxc.apparmor.profile = unconfined
      lxc.cap.drop =
    security:
      interceptBPF: true
      interceptBPFDevices: true
      nesting: true
      privileged: true
  source:
    endpoint: https://nixos.bioskop:8443
    project: rke2lab
