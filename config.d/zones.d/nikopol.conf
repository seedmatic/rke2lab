# slacoin@nuxeo.com gnupg keyring (https://github.com/nxmatic/keyhole.git)

# `rdp.nikopol`, `nixos.nikopol` and `vzhost.nikopol` are NOT defined here —
# their stanzas live in modules/home-manager/ssh-tailnet-hosts.nix, rendered
# uniformly for every bare-metal host. Resolution + reachability ride the
# per-baremetal split-DNS zone + advertised subnet route (the former per-host
# ARP resolver / ProxyCommand is retired).
#
# ⛔ Do not give `nixos.nikopol` a HostName here. The name resolves on its own,
# to the fabric (nikopol's dnsmasq), and it is a principal of the guest's host
# certificate. `HostName nikopol-nixos` sent it to the home LAN instead: a
# single-label name gets the search list applied, and `lan` answers first.

Include ~/.ssh/config.d/zones.d/nikopol.d/*.conf
