---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-tailscale-operators
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: tailscale-funnel-cert-restore-operators
  - name: tailscale-funnel-cert-restore-workloads
  - name: tailscale-system-namespace-foundation
  - name: tailscale-system-namespace-workloads
  - name: tailscale-tailnet-purge-operators
  - name: tailscale-tailnet-purge-workloads
  force: true
  interval: 5m
  path: ./operators/tailscale/tailscale
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
