apiVersion: cluster.seedmatic.io/v1alpha1
kind: NodeImage
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-workload
  name: nikopol-mgmt-node-base
  namespace: rke2lab-nikopol-mgmt
spec:
  alias: node-base
  buildChecksum: 2f7f7572f1de61d464978fadbeb0789c5bb0fe7c7ba88e2d25e72429593b900b
  fingerprint: 6e5d3e0c8d7954a1f9656775ed9be445ed01f0c55be455b144539a5780525ae9
  rke2Version: v1.36.4+rke2r1
  runtime:
    kernelModules:
      - ip_vs
      - ip_vs_rr
      - ip_vs_wrr
      - ip_vs_sh
      - netlink_diag
      - nf_nat
      - overlay
      - br_netfilter
      - xt_socket
      - xfrm_user
      - nft_compat
      - xt_mark
      - xt_CT
      - xt_TPROXY
      - xt_comment
      - xt_conntrack
    rawLXC: |-
      lxc.mount.auto = proc:rw sys:rw cgroup:rw
      lxc.apparmor.profile = unconfined
      lxc.cap.drop =
    security:
      interceptBPF: true
      interceptBPFDevices: true
      nesting: true
      privileged: true
  source:
    endpoint: https://nixos.bioskop:8443
    project: rke2lab
