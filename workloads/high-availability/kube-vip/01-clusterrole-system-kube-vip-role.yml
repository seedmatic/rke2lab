---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: high-availability
    io.seedmatic.rke2lab/package: kube-vip
    rbac.authorization.kubernetes.io/autoupdate: "true"
  name: system:kube-vip-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  - services/status
  - nodes
  - endpoints
  verbs:
  - list
  - get
  - watch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - list
  - get
  - watch
  - update
  - create
