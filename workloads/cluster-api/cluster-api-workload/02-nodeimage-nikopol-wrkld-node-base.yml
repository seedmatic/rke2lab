apiVersion: cluster.seedmatic.io/v1alpha1
kind: NodeImage
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-workload
  name: nikopol-wrkld-node-base
  namespace: rke2lab-nikopol-wrkld
spec:
  alias: node-base
  buildChecksum: 2d45811c75d89887e1d88359b8b1c62d595cb5245c52d0cf62956ddfe511857a
  fingerprint: 0c76ed24d7c0e6870f931c2a1c48e1663d0bdc997b682de0a55bbb4697503969
  rke2Version: v1.34.11+rke2r1
  runtime:
    kernelModules:
      - ip_vs
      - ip_vs_rr
      - ip_vs_wrr
      - ip_vs_sh
      - netlink_diag
      - nf_nat
      - overlay
      - br_netfilter
      - xt_socket
      - xfrm_user
      - nft_compat
      - xt_mark
      - xt_CT
      - xt_TPROXY
      - xt_comment
      - xt_conntrack
    rawLXC: |-
      lxc.mount.auto = proc:rw sys:rw cgroup:rw
      lxc.apparmor.profile = unconfined
      lxc.cap.drop =
    security:
      interceptBPF: true
      interceptBPFDevices: true
      nesting: true
      privileged: true
  source:
    endpoint: https://nixos.bioskop:8443
    project: rke2lab
