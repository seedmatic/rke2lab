apiVersion: cluster.seedmatic.io/v1alpha1
kind: ClusterIntention
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-management
  name: bioskop-mgmt
  namespace: rke2lab-bioskop-mgmt
spec:
  adoptedBy: bioskop-mgmt
  clusterName: bioskop-mgmt
  clusterNetwork:
    podCIDRs:
      - 10.128.0.0/16
    serviceCIDRs:
      - 10.160.0.0/16
    serviceDomain: cluster.local
  controlPlaneEndpoint:
    host: 10.80.7.10
    port: 6443
  kind: management
  namespace: rke2lab-bioskop-mgmt
  remote:
    endpoint: https://nixos.bioskop:8443
    identitySecretName: bioskop-incus-identity
