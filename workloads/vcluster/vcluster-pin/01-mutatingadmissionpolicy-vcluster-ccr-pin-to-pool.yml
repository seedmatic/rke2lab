apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: vcluster
    io.seedmatic.rke2lab/package: vcluster-pin
  name: vcluster-ccr-pin-to-pool
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  mutations:
    - jsonPatch:
        expression: "has(object.spec.nodeSelector) ? [JSONPatch{op: \"add\", path: \"/spec/nodeSelector/\" + jsonpatch.escapeKey(\"project\"), value: \"ccr\"}] : [JSONPatch{op: \"add\", path: \"/spec/nodeSelector\", value: {\"project\": \"ccr\"}}]"
      patchType: JSONPatch
  reinvocationPolicy: IfNeeded
