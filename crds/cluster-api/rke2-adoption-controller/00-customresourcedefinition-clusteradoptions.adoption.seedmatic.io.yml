---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: rke2-adoption-controller
  name: clusteradoptions.adoption.seedmatic.io
spec:
  group: adoption.seedmatic.io
  names:
    kind: ClusterAdoption
    listKind: ClusterAdoptionList
    plural: clusteradoptions
    shortNames:
    - capiadopt
    singular: clusteradoption
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.adoptedInstance
      name: Instance
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterAdoption is the request to adopt one running RKE2-on-Incus control plane into CAPI.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterAdoptionSpec is the recipe seed-master fills for one cluster to be adopted into
              Cluster API. The controller expands it into the full CAPI CR-set (Cluster + LXCCluster +
              RKE2ControlPlane + LXCMachineTemplate) and — the part GitOps cannot do — creates the OWNED
              control-plane Machine + concrete LXCMachine (providerID) so CAPRKE2/CAPN adopt the RUNNING
              Pulumi-bootstrapped instance instead of provisioning a fresh one. The BYO-CA Secrets
              (<clusterName>-{ca,cca,etcd,peer-etcd}) and the identity Secret are delivered by seed-master
              into Namespace (branch, sops-encrypted); this controller only references them.
            properties:
              clusterName:
                description: |-
                  ClusterName is the CAPI Cluster name to create and adopt (e.g. "bioskop-mgmt"). The
                  control-plane instance adopted is "<ClusterName>-master" with providerID
                  "lxc:///<ClusterName>-master" — the deterministic name Pulumi grew.
                minLength: 1
                type: string
              clusterNetwork:
                description: ClusterNetwork carries the pod/service CIDRs + the service domain.
                properties:
                  podCIDRs:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  serviceCIDRs:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  serviceDomain:
                    default: cluster.local
                    type: string
                required:
                - podCIDRs
                - serviceCIDRs
                type: object
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the kube-vip VIP fronting the apiserver.
                properties:
                  host:
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - host
                - port
                type: object
              controlPlaneReplicas:
                description: |-
                  ControlPlaneReplicas is the RKE2ControlPlane replica count — 1 for a management
                  cluster (single control node), 3 for a workload HA plane.
                format: int32
                minimum: 1
                type: integer
              identitySecretName:
                description: |-
                  IdentitySecretName is the CAPN per-remote incus identity Secret the LXCCluster.secretRef
                  names (e.g. "bioskop-incus-identity"), resolved in Namespace.
                minLength: 1
                type: string
              image:
                description: |-
                  Image pins the nix-built node-base by fingerprint and the RKE2 version — the SAME
                  node-base the running instance booted on (so the adopted machine template matches).
                properties:
                  fingerprint:
                    minLength: 1
                    type: string
                required:
                - fingerprint
                type: object
              kubeVIPVersion:
                description: KubeVIPVersion pins the kube-vip image the control-plane bootstrap deploys.
                minLength: 1
                type: string
              namespace:
                description: |-
                  Namespace is where the CAPI CR-set and the referenced Secrets live (e.g.
                  "rke2lab-bioskop-mgmt").
                minLength: 1
                type: string
              rke2Version:
                description: RKE2Version is the CAPRKE2 control-plane version (e.g. "v1.34.8+rke2r2").
                minLength: 1
                type: string
            required:
            - clusterName
            - clusterNetwork
            - controlPlaneEndpoint
            - controlPlaneReplicas
            - identitySecretName
            - image
            - kubeVIPVersion
            - namespace
            - rke2Version
            type: object
          status:
            description: ClusterAdoptionStatus records what the controller observed.
            properties:
              adoptedInstance:
                description: |-
                  AdoptedInstance is the instance name the owned Machine binds (e.g.
                  "bioskop-mgmt-master").
                type: string
              conditions:
                description: Conditions follow the standard metav1.Condition contract.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                      type: string
                    status:
                      description: "status of the condition, one of True, False, Unknown."
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                description: Phase is the coarse lifecycle stage.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
