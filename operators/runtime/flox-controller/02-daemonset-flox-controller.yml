---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: runtime
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: flox-controller
  labels:
    app.kubernetes.io/component: node-agent
    app.kubernetes.io/name: flox-controller
  name: flox-controller
  namespace: rke2lab-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flox-controller
  template:
    metadata:
      annotations:
        io.seedmatic.rke2lab/domain: runtime
        io.seedmatic.rke2lab/layer: operators
        io.seedmatic.rke2lab/package: flox-controller
      labels:
        app.kubernetes.io/component: node-agent
        app.kubernetes.io/name: flox-controller
    spec:
      containers:
      - args:
        - --gcroot-base=/nix/var/nix/gcroots/flox-runtime/env
        - --env-root=/var/lib/flox-controller/envs
        - --enable-webhook
        - --token-secret-name=floxhub-token
        - --token-secret-key=token
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PATH
          value: /run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:/usr/bin:/bin
        - name: CONTAINERD_ADDRESS
          value: /run/k3s/containerd/containerd.sock
        - name: FLOX_FLOXHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: floxhub-token
              optional: true
        image: io.seedmatic.flox-controller:0.0.0-develop
        imagePullPolicy: IfNotPresent
        name: controller
        ports:
        - containerPort: 9443
          name: webhook
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 20m
            memory: 256Mi
        securityContext:
          privileged: true
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /nix
          name: host-nix
        - mountPath: /run/k3s/containerd/containerd.sock
          name: containerd-sock
        - mountPath: /var/lib/flox-controller/envs
          name: env-root
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
      hostPID: true
      nodeSelector:
        flox.seedmatic.io/enabled: "true"
      restartPolicy: Always
      serviceAccountName: flox-controller
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /nix
          type: Directory
        name: host-nix
      - hostPath:
          path: /run/k3s/containerd/containerd.sock
          type: Socket
        name: containerd-sock
      - hostPath:
          path: /var/lib/flox-controller/envs
          type: DirectoryOrCreate
        name: env-root
      - name: webhook-certs
        secret:
          secretName: flox-controller-webhook-tls
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
