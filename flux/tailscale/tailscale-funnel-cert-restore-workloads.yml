---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-funnel-cert-restore-workloads
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: tailscale-system-namespace-foundation
  - name: tailscale-system-namespace-workloads
  force: true
  interval: 5m
  path: ./workloads/tailscale/funnel-cert-restore
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
