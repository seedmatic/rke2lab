apiVersion: flox.seedmatic.io/v1alpha1
kind: FloxEnv
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: runtime
    io.seedmatic.rke2lab/package: flox-envs
  name: kube
  namespace: rke2lab-system
spec:
  consumption: overlay
  folder: toolchains
  manifest:
    install:
      bash:
        flake: floxcatalog:catalog#bash
      coreutils:
        flake: floxcatalog:catalog#coreutils
      kubectl:
        flake: floxcatalog:catalog#kubectl
      yq-go:
        flake: floxcatalog:catalog#yq-go
    options:
      systems:
        - aarch64-linux
    schema-version: 1.10.0
