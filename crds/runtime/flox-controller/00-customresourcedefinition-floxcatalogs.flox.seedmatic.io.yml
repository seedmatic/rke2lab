---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    io.seedmatic.rke2lab/domain: runtime
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: flox-controller
  name: floxcatalogs.flox.seedmatic.io
spec:
  group: flox.seedmatic.io
  names:
    kind: FloxCatalog
    listKind: FloxCatalogList
    plural: floxcatalogs
    shortNames:
    - fcl
    singular: floxcatalog
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceRef.name
      name: Source
      type: string
    - jsonPath: .spec.dir
      name: Dir
      type: string
    - jsonPath: .status.revision
      name: Revision
      type: string
    - jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FloxCatalog binds a nix flake (a workload-package catalog) to a Flux source.

          Reconciliation: the controller reads the referenced GitRepository's status.artifact —
          the in-cluster tarball Flux's source-controller serves at the reconciled commit (Flux
          already fetched + authenticated it, so there is no external fetch and no token here) —
          and derives status.flakeRef = "tarball+<artifact-url>?dir=<spec.dir>", the concrete nix
          reference pinned to that EXACT commit. A FloxEnv install entry "floxcatalog:<name>#<output>"
          is rewritten to "<flakeRef>#<output>" before flox ever sees the manifest, so many FloxEnvs
          share one pinned catalog while the controller stays generic (it only knows how to resolve
          a flake from a Flux source — nothing about the workload). A new reconciled artifact (new
          commit) re-derives status.flakeRef, keeping the flake in lock-step with the deployed
          manifests (same commit, no drift).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FloxCatalogSpec binds a nix flake (the workload-package catalog) to a Flux source.
              A FloxEnv references it via `install.<id>.flake = "floxcatalog:<name>#<output>"`; the
              controller rewrites that to the concrete nix ref derived from the source's artifact.
              This is the source/consumer split (à la Flux Kustomization -> GitRepository): the
              controller stays generic — it knows nothing about the workload, only how to resolve
              a flake output from a Flux source.
            properties:
              dir:
                description: |-
                  Dir is the flake root within the source tree (the subdir holding flake.nix),
                  e.g. "runtime/flox". Empty means the source tree root.
                type: string
              sourceRef:
                description: SourceRef is the Flux source whose reconciled artifact carries the flake tree.
                properties:
                  kind:
                    default: GitRepository
                    description: Kind of the Flux source. Only GitRepository is supported today.
                    enum:
                    - GitRepository
                    type: string
                  name:
                    description: Name of the Flux source object.
                    type: string
                  namespace:
                    description: Namespace of the Flux source object. Defaults to the FloxCatalog's namespace.
                    type: string
                required:
                - name
                type: object
            required:
            - sourceRef
            type: object
          status:
            description: FloxCatalogStatus reports the concrete artifact the controller has pinned the flake to.
            properties:
              artifactURL:
                description: |-
                  ArtifactURL is the in-cluster tarball URL (Flux source-controller) the flake is
                  resolved from at this revision.
                type: string
              conditions:
                description: Conditions is the standard condition set (Ready once an artifact is resolved).
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                      type: string
                    status:
                      description: "status of the condition, one of True, False, Unknown."
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              flakeRef:
                description: |-
                  FlakeRef is the concrete nix flake reference the controller derives for this
                  artifact (e.g. "tarball+http://…/<sha>.tar.gz?dir=runtime/flox"), reused by every
                  FloxEnv that references this FloxCatalog.
                type: string
              revision:
                description: |-
                  Revision is the source's reconciled revision the flake is pinned to
                  (e.g. "manifests/bioskop-mgmt@sha1:42a4846…").
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
