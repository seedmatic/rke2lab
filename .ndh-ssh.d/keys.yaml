  headscale-tls-server:
    type: ecdsa-sha2-nistp256
    authority: mammoth-skate-tls
    cert_usage:
      - tls-server
    comment: headscale-tls-server@mammoth-skate
    usage:
      - host-signing
    profiles:
      - user
    tls:
      common_name: mammoth-skate.duckdns.org
      sans:
        dns:
          - mammoth-skate.duckdns.org
          - headscale.mammoth-skate.test
          - headscale.mammoth-skate.local
      not_after_days: 365
    annotations:
      public_scope: system
  # The nch relay's TLS edge. The relay HOLDS the corporate SSO on vzhost.nikopol, where it
  # listens on LOOPBACK only (launchd socket activation, user agent — the smallest footprint
  # on an EDR-monitored machine). The fabric-facing endpoint lives on the NixOS guest, which
  # owns fabric-br and is not monitored, so THIS leaf is for that guest, not for the Mac.
  #
  # Every name is DERIVED from ndh's catalog for the nikopol host — `fabricFqdn`,
  # `nixosHostname`, `netGateway` — and nch's module refuses a certificate whose SANs
  # disagree with that derivation, so the drift is caught instead of being lived with.
  # Compare with `nix eval .#lib.edgeSanSpec` in nch: that derived list is the authority and
  # this one is the copy.
  #
  # ★ This pointer is load-bearing, not courtesy: `.ndh-ssh.d/` is a SUBTREE whose tree ndh
  # owns, so whoever reads this entry is reading a SYNCHRONIZED COPY and has no local author
  # to ask. The reference is the only thing that says where the decision was made.
  #
  # The design and the two rejected alternatives (a Tailscale certificate is bound to a node
  # the holder must never become; the corporate PKI's certificate authenticates us to them,
  # not our clients to us) are recorded in seedmatic/nch at
  # docs/architecture/trust-chain.adoc, with docs/architecture/relay-topology.adoc for the
  # shape this leaf serves.
  nch-relay-tls-server:
    type: ecdsa-sha2-nistp256
    authority: mammoth-skate-tls
    cert_usage:
      - tls-server
    comment: nch-relay-tls-server@nixos.nikopol
    usage:
      - host-signing
    profiles:
      - system
    tls:
      common_name: nixos.nikopol
      sans:
        dns:
          - nixos.nikopol
          - nikopol-nixos
        ip:
          - 172.16.16.1
      not_after_days: 365
    annotations:
      public_scope: system
  vz-nudge:
    type: ssh-ed25519
    authority: mammoth-skate
    cert_usage:
      - ssh-host
      - ssh-user
    comment: vz-nudge@mammoth-skate — corp-Mac baremetal-link guest-reconfigure nudge; module-generated rotating key
    usage:
      - ssh-host
      - user-signing
    profiles:
      - system
    principals:
      rdp-host: rdp-host
    annotations:
      public_scope: system
