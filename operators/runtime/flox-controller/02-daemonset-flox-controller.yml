apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: runtime
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: flox-controller
  labels:
    app.kubernetes.io/component: node-agent
    app.kubernetes.io/name: flox-controller
  name: flox-controller
  namespace: rke2lab-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flox-controller
  template:
    metadata:
      annotations:
        io.seedmatic.rke2lab/domain: runtime
        io.seedmatic.rke2lab/layer: operators
        io.seedmatic.rke2lab/package: flox-controller
      labels:
        app.kubernetes.io/component: node-agent
        app.kubernetes.io/name: flox-controller
    spec:
      containers:
        - args:
            - --gcroot-base=/nix/var/nix/gcroots/flox-runtime/env
            - --env-root=/var/lib/flox-controller/envs
            - --enable-webhook
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PATH
              value: /run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:/usr/bin:/bin
            - name: CONTAINERD_ADDRESS
              value: /run/k3s/containerd/containerd.sock
            - name: GITHUB_ACCESS_TOKEN_FILE
              value: /var/run/flox/github-token/token
          image: io.seedmatic.flox-controller:31if96cpa1ga3l2q6a5nx0a51m296ja0
          imagePullPolicy: IfNotPresent
          name: controller
          ports:
            - containerPort: 9443
              name: webhook
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 128Mi
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /nix
              name: host-nix
            - mountPath: /run/k3s/containerd/containerd.sock
              name: containerd-sock
            - mountPath: /var/lib/flox-controller/envs
              name: env-root
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-certs
              readOnly: true
            - mountPath: /var/run/flox/github-token
              name: github-token
              readOnly: true
      hostPID: true
      nodeSelector:
        flox.seedmatic.io/enabled: "true"
      restartPolicy: Always
      serviceAccountName: flox-controller
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
        - key: node-role.kubernetes.io/etcd
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node.kubernetes.io/not-ready
          operator: Exists
        - key: node.kubernetes.io/unreachable
          operator: Exists
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
        - key: node.kubernetes.io/network-unavailable
          operator: Exists
        - key: node.kubernetes.io/unschedulable
          operator: Exists
        - key: node.cloudprovider.kubernetes.io/uninitialized
          operator: Exists
        - key: node.cluster.x-k8s.io/uninitialized
          operator: Exists
        - key: node.cilium.io/agent-not-ready
          operator: Exists
      volumes:
        - hostPath:
            path: /nix
            type: Directory
          name: host-nix
        - hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
          name: containerd-sock
        - hostPath:
            path: /var/lib/flox-controller/envs
            type: DirectoryOrCreate
          name: env-root
        - name: webhook-certs
          secret:
            secretName: flox-controller-webhook-tls
        - name: github-token
          secret:
            optional: true
            secretName: github-token
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
