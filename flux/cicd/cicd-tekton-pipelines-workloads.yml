apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cicd-tekton-pipelines-workloads
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cicd-tekton-pipelines-crds
  force: true
  healthCheckExprs:
    - apiVersion: operator.tekton.dev/v1alpha1
      current: "has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      kind: TektonConfig
  healthChecks:
    - apiVersion: operator.tekton.dev/v1alpha1
      kind: TektonConfig
      name: config
  interval: 5m
  path: ./workloads/cicd/tekton-pipelines
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: false
