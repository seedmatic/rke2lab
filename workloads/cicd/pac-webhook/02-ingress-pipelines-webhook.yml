---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cicd
    io.seedmatic.rke2lab/package: pac-webhook
    tailscale.com/funnel: "true"
    tailscale.com/proxy-class: pipelines-webhook
  name: pipelines-webhook
  namespace: tekton-pipelines
spec:
  defaultBackend:
    service:
      name: pipelines-as-code-controller
      port:
        number: 8080
  ingressClassName: tailscale
  tls:
  - hosts:
    - pipelines-webhook
