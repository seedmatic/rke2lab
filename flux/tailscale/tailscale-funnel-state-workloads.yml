---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-funnel-state-workloads
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: runtime-flox-controller-crds
  - name: runtime-flox-controller-operators
  - name: runtime-flox-controller-workloads
  - name: runtime-flox-webhook-operators
  - name: runtime-flox-webhook-workloads
  - name: tailscale-tailscale-operators
  - name: tailscale-tailscale-workloads
  force: true
  interval: 5m
  path: ./workloads/tailscale/funnel-state
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
