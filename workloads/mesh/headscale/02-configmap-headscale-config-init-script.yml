---
apiVersion: v1
data:
  config-init.sh: "#!/usr/bin/env bash\nset -exuo pipefail\nmkdir -p /config\ncp /config-source/config.yaml /config/config.yaml\nmkdir -p /var/lib/headscale\nif [ ! -f /var/lib/headscale/extra_records.json ]; then \n  echo \"[]\" > /var/lib/headscale/extra_records.json; \nfi\ncp /extra-records-source/extra_records.json /var/lib/headscale/extra_records.json\n"
kind: ConfigMap
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: mesh
    io.seedmatic.rke2lab/package: headscale
  labels:
    app: headscale
  name: headscale-config-init-script
  namespace: mesh-system
