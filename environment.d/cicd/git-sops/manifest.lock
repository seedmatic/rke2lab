      "on-activate": "  # Wire git to the package's `sops` include (top-level file the git-sops-filter output\n  # carries, surfaced at $FLOX_ENV/sops). Its relative `path = sops.d/<fmt>` entries and\n  # the absolute filter/diff commands both resolve inside the package's own store path.\n  # Guarded so repeated activations do not stack duplicate include.path entries.\n  if ! git config --global --get-all include.path 2>/dev/null | grep -qxF \"$FLOX_ENV/sops\"; then\n    git config --global --add include.path \"$FLOX_ENV/sops\"\n  fi\n"
