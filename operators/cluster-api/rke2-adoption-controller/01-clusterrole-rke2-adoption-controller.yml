---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: rke2-adoption-controller
  name: rke2-adoption-controller
rules:
- apiGroups:
  - adoption.seedmatic.io
  resources:
  - clusteradoptions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - adoption.seedmatic.io
  resources:
  - clusteradoptions/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  - machines
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - controlplane.cluster.x-k8s.io
  resources:
  - rke2controlplanes
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - lxcclusters
  - lxcmachines
  - lxcmachinetemplates
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
