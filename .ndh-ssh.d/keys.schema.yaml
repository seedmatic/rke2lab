# @codebase JSON Schema (draft 2020-12) for the NDH SSH keys bundle.
# Authored in YAML so reviewers can eyeball it next to keys.v2.yaml.
# check-jsonschema accepts YAML schemas directly (via ruamel-yaml).
#
# Validation scope: structural. ENC[...] scalars are accepted as opaque
# strings (the encrypted envelope is validated separately by sops).
#
# Cross-reference validation (keys.<k>.authority must resolve to a top-level
# authorities.<name>) is not expressible in JSON Schema and lives in a
# companion script — to be added after the v2 migration stabilizes.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/nxmatic/nix-darwin-home/modules/home-manager/ssh.d/keys.schema.yaml"
title: "NDH SSH keys bundle (v2)"
type: object
additionalProperties: false
required:
  - authorities
  - keys
properties:
  authorities:
    type: object
    description: >
      Top-level signing authorities, referenced by name from each key's
      `authority:` field. Each authority appears once; its private key is
      encrypted exactly once by sops (no duplication across dependent keys).
    patternProperties:
      "^[a-z][a-z0-9-]*$":
        $ref: "#/$defs/authority"
    additionalProperties: false
  keys:
    type: object
    description: >
      Per-identity entries keyed by bare key name (e.g. `nix-store`,
      `linux-builder`). Each entry references a top-level authority by name
      instead of inlining the authority block.
    patternProperties:
      "^[a-z][a-z0-9-]*$":
        $ref: "#/$defs/key"
    additionalProperties: false
  revoked:
    type: object
    description: >
      Generations no sshd may accept any more, keyed `<name>@<YY-MM-DD>` — the
      slot they were retired from. Refused raw AND as a certificate, whichever
      authority signed it; a revoked authority key takes every certificate it
      signed with it. Certificates here are valid forever, so retiring a slot
      alone does not stop a copied certificate: this list does. A generation
      enters it in the same change that deletes its slot, never while the slot
      still exists (eval refuses that, it would lock the key's users out).
    patternProperties:
      "^[a-z][a-z0-9-]*@[0-9]{2}-[0-9]{2}-[0-9]{2}$":
        $ref: "#/$defs/revokedKey"
    additionalProperties: false
  sops:
    type: object
    description: "Opaque sops metadata; validated by sops itself."

$defs:

  revokedKey:
    type: object
    required: [type, public, reason]
    additionalProperties: false
    properties:
      type:
        $ref: "#/$defs/sshKeyType"
      public:
        $ref: "#/$defs/publicBlob"
      reason:
        type: string
        minLength: 1

  sshKeyType:
    type: string
    enum:
      - ssh-ed25519
      - ssh-rsa
      - ecdsa-sha2-nistp256
      - ecdsa-sha2-nistp384
      - ecdsa-sha2-nistp521

  usageTag:
    type: string
    enum:
      - ssh-host
      - ssh-user
      - ssh-authority
      - user-signing
      - agent-signing
      - host-signing
      - github-signing
      # Authenticates to GitHub over ssh and nothing else — kept apart from
      # github-signing so a leak of one grants either push access or a
      # "Verified" signature, never both.
      - github-authentication
      # v2.1: the `mammoth-skate` authority also signs TLS x509 certs so
      # headscale can serve HTTPS without introducing a second CA key.
      # Leaf keys declare `cert_usage: [tls-server]` (and optionally
      # `tls-client` in future) to opt into x509 issuance alongside SSH
      # certs.  See modules/nixos/headscale-daemon.nix for the first
      # consumer.
      - tls-authority

  profileName:
    type: string
    description: >
      Profile identifier. Matches an entry in `profile.names` in Nix.
      The split step filters keys to those whose `profiles:` list
      contains a name this host participates in. Profiles are orthogonal
      (no implicit inheritance): a key whose profiles omit `bringup` is
      excluded from bringup images even if it has `system`.

      Profile names correspond to *where the extracted key material lands*:

        bringup — installed into the nixos minimal bringup image so first
                  boot can decrypt sops (only `nix-store` qualifies today).
        system  — root-owned, host-wide placement: sshd HostKey, remote
                  builder key, nix-store identity. Privates land under
                  sshPaths.systemKeysDir (`/var/lib/ndh/ssh-keys/` on
                  darwin) and downstream modules copy the specific ones
                  they need (e.g. `/etc/nix/builder_ed25519`).
        user    — operator identity, installed under the user's home:
                  `~/.local/var/run/secrets/ssh-keys/`. Outbound ssh,
                  git signing, etc.
    enum:
      - bringup
      - system
      - user

  # Accepts any of the forms a key material field can take at rest:
  #  - sops-encrypted envelope `ENC[...]`
  #  - OpenSSH PEM block `-----BEGIN OPENSSH PRIVATE KEY-----...-----END...-----`
  #  - raw base64 public blob (possibly with `ssh-<type>` prefix + comment)
  # Uses anyOf (not oneOf) because a sops-encrypted scalar happens to also
  # satisfy the minLength predicate; the intent is "any of the known
  # shapes", not "exactly one shape".
  base64OrEnc:
    anyOf:
      - type: string
        pattern: '^ENC\[.*\]$'
      - type: string
        pattern: '^-----BEGIN [A-Z ]+PRIVATE KEY-----'
      - type: string
        minLength: 40

  publicBlob:
    description: >
      The BARE base64 blob, with no `ssh-ed25519 ` prefix and no trailing
      comment: the type lives in `type:` and the comment in `comment:`, and
      consumers rebuild the `<type> <blob> <comment>` line from the three.
      The pattern is the barrier: writing a whole line in here instead doubled
      both the type and the comment in every rebuilt line, and `ssh-keygen -lf`
      accepted the result without complaint.
    anyOf:
      - type: string
        pattern: '^ENC\[.*\]$'
      - type: string
        pattern: '^[A-Za-z0-9+/]{40,}={0,2}$'

  principalsMap:
    type: object
    description: >
      Mapping of certificate principal names to their local user name on
      the target host. The principal name is what appears in the signed
      cert's Principals list; the value is the login name it grants.
    patternProperties:
      "^[a-z][a-z0-9-]*$":
        type: string
        pattern: "^[a-z_][a-z0-9_-]*$"
    additionalProperties: false

  slots:
    type: object
    description: >
      Generations of key material, keyed by the date it was created (YY-MM-DD).
      The generation that is PRESENTED is derived from the newest key; every slot
      is ACCEPTED. One slot is settled, two is a renewal in flight. Three means
      phase 2 of a renewal was skipped, which is why maxProperties is 2 — the
      schema enforces what the shell also asserts. Two digits for the year keeps
      the key a plain string: YAML types a four-digit date as !!timestamp, and the
      enrichment writes with `yq -i`, which may re-serialise a typed key.
      A slot may be EMPTY, which is how a renewal is requested: the enrichment
      generates material for whichever slot has none.
      See docs/ssh-keys-renewal-spec.adoc.
    minProperties: 1
    maxProperties: 2
    propertyNames:
      pattern: "^[0-9]{2}-[0-9]{2}-[0-9]{2}$"
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        public:
          $ref: "#/$defs/publicBlob"
        private:
          $ref: "#/$defs/base64OrEnc"
        certificates:
          $ref: "#/$defs/certificates"

  certificates:
    type: object
    description: >
      Signed certificates for THIS generation of the key, keyed by authority
      name then by cert type. A certificate belongs to the generation it
      certifies, which is why it sits inside the slot rather than beside it:
      during a renewal both generations are published, and each needs its own.

      Populated by the enrichment step output; never present in the input
      shape, and never persisted — keys are stable and certificates are
      derived. SSH cert types carry a single-line openssh format; TLS types
      carry a PEM blob (multi-line, BEGIN/END CERTIFICATE).

      The signing authority is always the PRESENTED one. An authority renews
      before its leaves, so a single certificate per key generation suffices;
      see docs/ssh-keys-renewal-spec.adoc.
    patternProperties:
      "^[a-z][a-z0-9-]*$":
        type: object
        additionalProperties: false
        properties:
          ssh-user:
            type: string
            pattern: "^ssh-[a-z0-9-]+-cert-v01@openssh.com "
          ssh-host:
            type: string
            pattern: "^ssh-[a-z0-9-]+-cert-v01@openssh.com "
          tls-server:
            type: string
            pattern: "^-----BEGIN CERTIFICATE-----"
    additionalProperties: false

  authority:
    type: object
    additionalProperties: false
    required:
      - type
      - slots
    properties:
      type:
        $ref: "#/$defs/sshKeyType"
      comment:
        type: string
      domain:
        type: string
        description: "DNS domain the authority asserts jurisdiction over."
      slots:
        $ref: "#/$defs/slots"
      ca_crt:
        type: string
        pattern: "^-----BEGIN CERTIFICATE-----"
        description: >
          Self-signed x509 root certificate (PEM), co-located with the
          authority's SSH key material.  Populated by the bootstrap
          ceremony (bin/authority-bootstrap-tls-root.sh) for authorities
          that advertise `tls-authority` in their `usage`.  Plaintext —
          cert bytes are public trust-anchor material, same category as
          the `public:` SSH key above.  Consumed by the enrichment
          pipeline (to sign TLS leaves via step-cli) and by downstream
          Nix modules that install the cert into every client's system
          trust store.
      usage:
        type: array
        description: >
          Usage tags the authority can sign certificates for. The enrichment
          step cross-checks `keys.<k>.usage` against this set before signing.
        items:
          $ref: "#/$defs/usageTag"
        minItems: 1
        uniqueItems: true
      annotations:
        type: object
        additionalProperties: true
        properties:
          public_scope:
            type: string
            enum:
              - user
              - system

  key:
    type: object
    additionalProperties: false
    required:
      - type
      - usage
      - profiles
      - slots
    # Cert-signed keys must declare both authority and cert_usage. Bare
    # keys (no signing, just a keypair) omit both. The allOf below enforces
    # the "either both or neither" invariant — JSON Schema's answer to
    # conditional requirements.
    allOf:
      - if:
          properties:
            authority:
              type: string
          required: [authority]
        then:
          required: [authority, cert_usage]
      - if:
          properties:
            cert_usage:
              type: array
          required: [cert_usage]
        then:
          required: [authority, cert_usage]
    properties:
      type:
        $ref: "#/$defs/sshKeyType"
      authority:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: >
          Reference to a top-level authorities.<name> block. Resolution is
          a separate pass (not expressible in JSON Schema).
      cert_usage:
        type: array
        description: >
          Which certificate types the referenced authority signs for this key.
          Drives the signing step:
            ssh-host    — ssh-keygen -s ... -h
            ssh-user    — ssh-keygen -s ... (user cert)
            tls-server  — openssl x509 with SAN/subject from the `tls:` block
          Distinct from `usage` which describes the key's semantic role.
          The authority named in `authority:` must advertise the matching
          capability under its own `usage:` — e.g. `tls-server` requires
          `tls-authority` on the signer.
        items:
          type: string
          enum:
            - ssh-host
            - ssh-user
            - tls-server
        minItems: 1
        uniqueItems: true
      tls:
        type: object
        description: >
          Subject + SAN material used by the x509 signing step when
          `cert_usage` contains `tls-server`.  Ignored otherwise.
        additionalProperties: false
        required:
          - common_name
        properties:
          common_name:
            type: string
            description: "x509 Subject CN for the leaf cert."
          sans:
            type: object
            description: "Subject Alternative Names."
            additionalProperties: false
            properties:
              dns:
                type: array
                items:
                  type: string
                  minLength: 1
                uniqueItems: true
              ip:
                type: array
                items:
                  type: string
                  minLength: 1
                uniqueItems: true
          not_after_days:
            type: integer
            minimum: 1
            maximum: 36500
            description: >
              Certificate lifetime in days.  Defaults to 365 if omitted.
              x509 format allows up to ~100 years; there is no CAB/forum
              cap here because the CA is operator-local (not publicly
              trusted), but keep values sane so rotation stays useful.
      usage:
        type: array
        items:
          $ref: "#/$defs/usageTag"
        minItems: 1
        uniqueItems: true
      profiles:
        type: array
        description: >
          Which profiles this key participates in. An empty list (or missing
          field) means the key is excluded from every profile — the split
          step warns on such entries.
        items:
          $ref: "#/$defs/profileName"
        minItems: 1
        uniqueItems: true
      comment:
        type: string
      slots:
        $ref: "#/$defs/slots"
      renew:
        enum: [on-activation, on-request]
        description: >
          Key material is stable by default and renewed on request. `on-activation`
          is the declared exception, for entries whose material is meant to be
          ephemeral. The default direction is deliberate: a forgotten annotation
          must be harmless, and forgetting it the other way round gives a key that
          changes on every activation, silently.
      principals:
        $ref: "#/$defs/principalsMap"
      authorized_keys_options:
        type: array
        items:
          type: string
      annotations:
        type: object
        additionalProperties: true
        properties:
          public_scope:
            type: string
            enum:
              - user
              - system
