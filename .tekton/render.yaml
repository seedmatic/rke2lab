# Pipelines-as-Code trigger stub — the ONE source footprint of the in-cluster render loop.
#
# PaC matches a PipelineRun in `.tekton/` on the pushed (source) branch — `pipelinerun_provenance`
# is only `source` or `default_branch`, so the pipeline LOGIC cannot be rendered; it lives in-cluster
# as the Flux-reconciled `render-manifests` Pipeline (RenderPipelineManifestsUnit). This stub is glue:
# which in-cluster Pipeline to run, on what event, with which workspaces + identity.
#
# See docs/architecture/cluster-api/pac-in-cluster-render-spec.adoc.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: render-manifests
  annotations:
    # Fire on a push to the grow branch (the source of truth: feature/viewpoint-separation today,
    # main at term). The render's OUTPUT push to manifests/<cluster> never matches this, so the loop
    # is cut at the trigger — no feedback re-trigger.
    #
    # ⚠️ SINGLE-VALUED on purpose, and it must be maintained. Every cluster's render publishes to the
    # shared manifests/<cluster> branches, so exactly one source branch may win — a pattern match
    # would let two feature branches fight over the same output. The cost is that this literal rots:
    # it still named feature/nixos-node-substrate weeks after that branch was retired, so a push
    # matched nothing and NO PipelineRun was created — no error, no run, nothing to notice (measured
    # 2026-09-28, which is why the new tls-san never reached the clusters). ndh's flake input encodes
    # the same fact and had rotted the same way; when this branch is superseded, both move together.
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[feature/viewpoint-separation]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    # nix-build capability (dogfooding the flox NRI): the render runs `nix run .#render-manifests`.
    # The value names the render's persistent nix-store PVC. The flox-controller webhook ensures
    # that PVC (create-if-absent in this namespace) + injects it as the /nix store overlay upper +
    # NIX_CONFIG; the NRI plugin puts nix on PATH. No flox env — nix owns the whole build+exec
    # closure. Keyed per-container (NO bare-key fallback), so it names the render step container
    # (step-render); only the render-publish pod owns one, so the git-fetch pod ignores it.
    flox.seedmatic.io/nix-build.step-render: "manifests-nix-store"
    # sops capability: the SAME step-render container ALSO gets the toolchains/git-sops flox env
    # (git + sops) — the NRI plugin composes a flox env AND a nix-build runtime on one container.
    # With SOPS_AGE_KEY (the env's spec.inject) the render opens .secrets and the in-cluster cellar
    # asset in memory and seals the branch Secrets it commits in memory, making the in-cluster
    # render secret-FULL instead of blind. No git filter is wired.
    flox.seedmatic.io/environment.step-render: "toolchains/git-sops"
    # The git-fetch pod's clone step ALSO runs on toolchains/git-sops (git + sops, on the
    # flox-carrier base) — no stock alpine/git image. Its checkout leaves .secrets ENCRYPTED in the
    # shared source workspace; the render opens it in memory. SOPS_AGE_KEY arrives via the env's
    # spec.inject (flox-controller webhook), not a hand-wired Task env. Keyed to the clone step's container (step-clone); the render-publish pod
    # has no such container so it ignores it.
    flox.seedmatic.io/environment.step-clone: "toolchains/git-sops"
spec:
  # The Pipeline is a RENDERED in-cluster manifest (RenderPipelineManifestsUnit), not inline here.
  # PaC's own resolver does NOT consult the cluster for a bare pipelineRef.name (it wants inline /
  # .tekton / a remote annotation) — so reference it through Tekton's CLUSTER resolver, which fetches
  # render-manifests from the cluster. Keeps "Tekton objects are rendered manifests" intact.
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: render-manifests
      # rke2lab OWNS the render pipeline, so RenderPipelineManifestsUnit renders it into
      # rke2lab-system (the runtime-system namespace), NOT tekton-pipelines (the PaC/Tekton
      # controllers' own system). The cluster resolver must look there, or the PipelineRun fails
      # CouldntGetPipeline ("render-manifests" not found).
      - name: namespace
        value: rke2lab-system
  params:
    # PaC dynamic variables (the pushed commit + repo).
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    # From the PaC Repository CR spec.params (RepositoryManifestsUnit) — the per-cluster identity.
    - name: cluster
      value: "{{ cluster }}"
    - name: node
      value: "{{ node }}"
  workspaces:
    # Per-run scratch shared fetch -> render. openebs-zfs-shared (shared=yes) lets the affinity
    # assistant + the task pods co-mount this one RWO volume on the single node (the default
    # exclusive SC gives "device already mounted").
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: openebs-zfs-shared
          resources:
            requests:
              storage: 2Gi
    # ⚠️ nix-store is bound here but DECLARED by no Pipeline workspace — a vestige of the pre-NRI
    # wiring (the store is the NODE's /nix overlay now, wired by the flox NRI plugin, its envs
    # provisioned in the node namespace via nsenter). Left alone deliberately: removing it is a
    # separate change, and it is not what this one is about.
    - name: nix-store
      persistentVolumeClaim:
        claimName: manifests-nix-store
    # PaC injects the App token here — .git-credentials + .gitconfig for the clone + the ff-push.
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
