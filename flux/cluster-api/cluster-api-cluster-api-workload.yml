---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-cluster-api-workload
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: cluster-api-cluster-api-operator-crds
  - name: cluster-api-cluster-api-operator-operators
  - name: cluster-api-cluster-api-operator-workloads
  force: true
  interval: 5m
  path: ./workloads/cluster-api/cluster-api-workload
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: false
