---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking-envoy-gateway-operators
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: networking-cilium-advanced
  - name: runtime-flox-controller-crds
  - name: runtime-flox-controller-operators
  - name: runtime-flox-controller-workloads
  - name: runtime-flox-webhook-operators
  - name: runtime-flox-webhook-workloads
  force: true
  interval: 5m
  path: ./operators/networking/envoy-gateway
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
