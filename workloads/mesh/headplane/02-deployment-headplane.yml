---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: mesh
    io.seedmatic.rke2lab/package: headplane
  labels:
    app: headplane
  name: headplane
  namespace: mesh-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headplane
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        flox.seedmatic.io/environment.headplane: mesh/headplane
        io.seedmatic.rke2lab/domain: mesh
        io.seedmatic.rke2lab/package: headplane
      labels:
        app: headplane
    spec:
      containers:
      - command:
        - sh
        - -c
        - ln -sf "$(command -v hp_agent)" /usr/libexec/headplane/agent && exec headplane serve
        env:
        - name: HEADPLANE_LOAD_ENV_OVERRIDES
          value: "true"
        - name: HEADPLANE_INTEGRATION__KUBERNETES__POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: headplane-env
        image: rke2lab/flox-carrier:0.1.0
        livenessProbe:
          exec:
            command:
            - flox
            - activate
            - --dir
            - /root
            - --
            - hp_healthcheck
          failureThreshold: 3
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 10
        name: headplane
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          exec:
            command:
            - flox
            - activate
            - --dir
            - /root
            - --
            - hp_healthcheck
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 512Mi
            memory: 512Mi
          requests:
            cpu: 100m
            ephemeral-storage: 256Mi
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/headplane/config.yaml
          name: config
          subPath: config.yaml
        - mountPath: /etc/headplane/secrets
          name: secrets
          readOnly: true
        - mountPath: /etc/headplane/agent
          name: agent
          readOnly: true
        - mountPath: /var/lib/headplane
          name: data
        - mountPath: /etc/headscale
          name: headscale-config
          readOnly: true
        - mountPath: /usr/libexec/headplane
          name: shared-bin
      serviceAccountName: headplane
      shareProcessNamespace: true
      volumes:
      - name: config
        secret:
          secretName: headplane-config
      - name: secrets
        secret:
          secretName: headplane-secrets
      - name: agent
        secret:
          secretName: headplane-agent-auth
      - name: data
        persistentVolumeClaim:
          claimName: headplane-data
      - configMap:
          name: headscale-config
        name: headscale-config
      - emptyDir: {}
        name: shared-bin
