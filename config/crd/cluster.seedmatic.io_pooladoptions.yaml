---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pooladoptions.cluster.seedmatic.io
spec:
  group: cluster.seedmatic.io
  names:
    kind: PoolAdoption
    listKind: PoolAdoptionList
    plural: pooladoptions
    shortNames:
    - capipooladopt
    singular: pooladoption
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .spec.pool
      name: Pool
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.present
      name: Present
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PoolAdoption is the pool-level mirror of one node pool of a running cluster in CAPI — it owns the
          pool's RCP/MD + templates + per-pet Machine/LXCMachine and runs the per-pool adopt-first state machine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PoolAdoptionSpec is the POOL-LEVEL mirror the controller owns from a PoolIntention. From it the
              controller builds the pool CR-set — the RKE2ControlPlane (control-plane pool) or MachineDeployment
              OWNED per-pet Machine + concrete LXCMachine (providerID) so CAPRKE2/CAPN adopt the RUNNING
              Pulumi-bootstrapped instances instead of provisioning fresh ones. It runs the per-pool adopt-first
              state machine and reports presence; cluster reachability is aggregated at the ClusterAdoption grain, not
              here. The BYO-CA Secrets (<cluster>-{ca,cca,etcd,peer-etcd}) — needed by a control-plane pool —
              are delivered by seed-master into Namespace; this controller only references them.
            properties:
              clusterName:
                description: ClusterName is the CAPI Cluster this pool belongs to
                  (the RCP/Machines reference it).
                minLength: 1
                type: string
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the kube-vip VIP a control-plane
                  pool registers its replicas on.
                properties:
                  host:
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - host
                - port
                type: object
              image:
                description: Image pins the nix-built node-base the pool's LXCMachines
                  boot on / adopt.
                properties:
                  fingerprint:
                    minLength: 1
                    type: string
                required:
                - fingerprint
                type: object
              namespace:
                description: Namespace is where the CAPI CR-set and the referenced
                  Secrets live.
                minLength: 1
                type: string
              nodeLabels:
                description: |-
                  NodeLabels are the kubelet --node-label values every node of this pool registers with, as
                  "key=value" — projected from the PoolIntention and posed on the RKE2ControlPlane's
                  agentConfig.nodeLabels, CAPRKE2's own field for this.
                items:
                  type: string
                type: array
              nodes:
                description: Nodes is the pool's explicit pet roster, adopted/provisioned
                  by providerID (lxc:///<name>).
                items:
                  description: |-
                    PetSpec is one named pet of a pool — the deterministic instance name (CANONICAL_NODE_NAMES), the
                    providerID basis (lxc:///<name>) and the LXCMachine object name CAPN matches the running instance
                    against. No cattle / no replica count: a named pet is the only shape that re-matches its survivor
                    after a cold-start.
                  properties:
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              pool:
                description: Pool is the pool identity (names the LXCMachineTemplate
                  / MachineDeployment).
                minLength: 1
                type: string
              rke2Version:
                description: RKE2Version is the CAPRKE2 version for this pool.
                minLength: 1
                type: string
              role:
                description: Role is the CAPI treatment (control-plane vs worker).
                enum:
                - control-plane
                - worker
                type: string
            required:
            - clusterName
            - controlPlaneEndpoint
            - image
            - namespace
            - nodes
            - pool
            - rke2Version
            - role
            type: object
          status:
            description: PoolAdoptionStatus records what the controller observed at
              the pool grain.
            properties:
              absent:
                description: Absent is how many pets CAPN reports genuinely absent
                  (InstanceDeleted → provision).
                format: int32
                type: integer
              conditions:
                description: Conditions follow the standard metav1.Condition contract
                  — one per pool step.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlPlaneUID:
                description: |-
                  ControlPlaneUID is the observed RKE2ControlPlane UID the owned per-pet Machines' ownerRef
                  carries (control-plane pool only) — the piece GitOps could not pre-set.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  this PoolAdoption.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              pending:
                description: Pending is how many pets CAPN has not yet decided presence
                  for.
                format: int32
                type: integer
              phase:
                description: Phase is the per-pool state machine stage.
                type: string
              present:
                description: Present is how many pets CAPN confirms present by providerID.
                format: int32
                type: integer
              totalPets:
                description: TotalPets is the pool's roster size (len(spec.Nodes)).
                format: int32
                type: integer
              voidedPets:
                description: |-
                  VoidedPets is the reflected roster this reconciler last declared VOID — every one of its pets
                  confirmed gone, so the reflection had nothing left to protect and its CR-set was dropped for
                  CAPRKE2 to re-provision. It has to be REMEMBERED: once the CR-set is gone the pets read
                  *undecided* rather than absent (no LXCMachine to carry CAPN's verdict), which is the same
                  reading as a cold-start, and the adopt branch would faithfully re-mint the very phantoms that
                  were just dropped. The reflector rewrites the reflection within seconds of the Machine events,
                  so this normally holds for one or two passes; it also holds if that git push is slow, which is
                  the case it exists for. Cleared as soon as the reflected roster differs or any pet is present.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
