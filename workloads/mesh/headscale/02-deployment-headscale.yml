---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: mesh
    io.seedmatic.rke2lab/package: headscale
  labels:
    app: headscale
  name: headscale
  namespace: mesh-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      annotations:
        flox.seedmatic.io/environment.config-init: mesh/headscale
        flox.seedmatic.io/environment.headscale: mesh/headscale
        io.seedmatic.rke2lab/domain: mesh
        io.seedmatic.rke2lab/package: headscale
      labels:
        app: headscale
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - headscale
        - serve
        image: rke2lab/flox-carrier:0.1.0
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        name: headscale
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 512Mi
            memory: 512Mi
          requests:
            cpu: 100m
            ephemeral-storage: 256Mi
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/headscale/config.yaml
          name: config
          subPath: config.yaml
        - mountPath: /etc/headscale/acl.json
          name: acl
          subPath: acl.json
        - mountPath: /etc/headscale/derp.yaml
          name: derp
          subPath: derp.yaml
        - mountPath: /var/lib/headscale
          name: data
        - mountPath: /var/run/headscale
          name: run
      initContainers:
      - command:
        - /scripts/config-init.sh
        image: rke2lab/flox-carrier:0.1.0
        name: config-init
        volumeMounts:
        - mountPath: /scripts
          name: config-init-script
        - mountPath: /config-source
          name: config-source
          readOnly: true
        - mountPath: /config
          name: config
        - mountPath: /extra-records-source
          name: extra-records-source
          readOnly: true
        - mountPath: /var/lib/headscale
          name: data
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      volumes:
      - configMap:
          name: headscale-config
        name: config-source
      - emptyDir: {}
        name: config
      - configMap:
          defaultMode: 493
          name: headscale-config-init-script
        name: config-init-script
      - configMap:
          name: headscale-extra-records
        name: extra-records-source
      - configMap:
          name: headscale-acl
        name: acl
      - configMap:
          name: headscale-derp
        name: derp
      - emptyDir: {}
        name: data
      - emptyDir: {}
        name: run
