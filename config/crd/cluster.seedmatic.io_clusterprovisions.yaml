---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterprovisions.cluster.seedmatic.io
spec:
  group: cluster.seedmatic.io
  names:
    kind: ClusterProvision
    listKind: ClusterProvisionList
    plural: clusterprovisions
    shortNames:
    - capiprov
    singular: clusterprovision
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.controlPlaneEndpoint.host
      name: Endpoint
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterProvision is the Flux-owned intent to bring one cluster into existence and keep it
          described in Cluster API — reconciled adopt-first by the controller, which owns the derived
          ClusterAdoption.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterProvisionSpec is the INTENT seed-master renders for one cluster — the Flux-owned recipe
              for bringing a cluster into existence AND keeping it described in Cluster API. The controller
              reconciles it ADOPT-FIRST: every reconcile it tries to describe the running reality (match each
              pet by providerID, skip bootstrap) before it ever provisions; a node that is genuinely absent is
              the only case CAPN launches. From this intent the controller OWNS a ClusterAdoption (the mirror
              that describes the running cluster) — the ownership split: Flux owns the intent (git-backed,
              survives a cold-start), the controller owns the adoption (re-derived from reality).

              Every field is filled by seed-master from the ClusterNetworkBlueprint SSOT; the controller
              templates, it never computes addressing.
            properties:
              clusterName:
                description: ClusterName is the CAPI Cluster name to bring to existence
                  and adopt (e.g. "bioskop-wrkld").
                minLength: 1
                type: string
              clusterNetwork:
                description: ClusterNetwork carries the pod/service CIDRs + the service
                  domain.
                properties:
                  podCIDRs:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  serviceCIDRs:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  serviceDomain:
                    default: cluster.local
                    type: string
                required:
                - podCIDRs
                - serviceCIDRs
                type: object
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the kube-vip VIP fronting the
                  apiserver.
                properties:
                  host:
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - host
                - port
                type: object
              image:
                description: Image pins the nix-built node-base by fingerprint — the
                  SAME node-base the instances boot on.
                properties:
                  fingerprint:
                    minLength: 1
                    type: string
                required:
                - fingerprint
                type: object
              kind:
                default: workload
                description: |-
                  Kind is the cluster's federated role — "workload" (a leaf) or "management" (a sub-plane that
                  itself runs a seed-incluster for ITS children). It records topological intent; the controller
                  provisions/adopts both identically (the difference is the render flavor seed-master delivers
                  INTO the cluster, not how it is birthed).
                enum:
                - workload
                - management
                type: string
              kubeVIPVersion:
                description: KubeVIPVersion pins the kube-vip image the control-plane
                  bootstrap deploys.
                minLength: 1
                type: string
              namespace:
                description: |-
                  Namespace is where the CAPI CR-set, the owned ClusterAdoption, and the referenced Secrets live
                  (e.g. "rke2lab-bioskop-wrkld").
                minLength: 1
                type: string
              nodes:
                description: |-
                  Nodes is the explicit PET list — every control-plane replica AND worker is a deterministic
                  blueprint name (CANONICAL_NODE_NAMES), adopted by providerID. No cattle / no MachineDeployment
                  replica count: a named pet is the only shape that re-matches its survivor after a cold-start.
                items:
                  description: NodeSpec is one named pet of the cluster.
                  properties:
                    name:
                      description: |-
                        Name is the deterministic instance name (e.g. "bioskop-wrkld-master") — the providerID basis
                        (lxc:///<name>) and the LXCMachine object name CAPN matches against the running instance.
                      minLength: 1
                      type: string
                    role:
                      description: |-
                        Role is "control-plane" (an etcd-member server, counts toward the RKE2ControlPlane replicas) or
                        "worker".
                      enum:
                      - control-plane
                      - worker
                      type: string
                  required:
                  - name
                  - role
                  type: object
                minItems: 1
                type: array
              remote:
                description: |-
                  Remote is the target Incus engine for THIS cluster's nodes — cluster-level, not per-node
                  (CAPN's LXCCluster.secretRef names one remote; a cluster's nodes share one host's fabric).
                properties:
                  endpoint:
                    description: |-
                      Endpoint is the Incus API endpoint (e.g. "https://bioskop-nixos:8443") — the local engine, or a
                      cross-host one reached over the tailnet.
                    minLength: 1
                    type: string
                  identitySecretName:
                    description: |-
                      IdentitySecretName is the per-remote CAPN identity Secret that the LXCCluster.secretRef names,
                      resolved in Namespace. The controller ALSO uses its client cert to PROBE instance presence on
                      this remote (the adopt-vs-provision decision). Its trust is CA-based (our owned Incus PKI).
                    minLength: 1
                    type: string
                required:
                - endpoint
                - identitySecretName
                type: object
              rke2Version:
                description: RKE2Version is the CAPRKE2 control-plane version (e.g.
                  "v1.34.8+rke2r2").
                minLength: 1
                type: string
            required:
            - clusterName
            - clusterNetwork
            - controlPlaneEndpoint
            - image
            - kubeVIPVersion
            - namespace
            - nodes
            - remote
            - rke2Version
            type: object
          status:
            description: ClusterProvisionStatus records what the controller observed.
            properties:
              adoptionRef:
                description: |-
                  AdoptionRef is the name of the ClusterAdoption this ClusterProvision owns (in Namespace),
                  created once the intent is handed off; empty until then.
                type: string
              conditions:
                description: Conditions follow the standard metav1.Condition contract.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  this ClusterProvision.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse funnel stage.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
