apiVersion: cluster.seedmatic.io/v1alpha1
kind: NodeImage
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-management
  name: bioskop-mgmt-node-base
  namespace: rke2lab-bioskop-mgmt
spec:
  alias: node-base
  buildChecksum: e6db499d47ac2ae77dc8b9bfe02fdd35f8553cbd906b287a49787d227e5173bd
  fingerprint: 9d5799dc0fe8c31ac20d6cfe18d825816e8455e638c5d705b3bed4459d0b376d
  rke2Version: v1.36.4+rke2r1
  runtime:
    kernelModules:
      - ip_vs
      - ip_vs_rr
      - ip_vs_wrr
      - ip_vs_sh
      - netlink_diag
      - nf_nat
      - overlay
      - br_netfilter
      - xt_socket
      - xfrm_user
      - nft_compat
      - xt_mark
      - xt_CT
      - xt_TPROXY
      - xt_comment
      - xt_conntrack
    rawLXC: |-
      lxc.mount.auto = proc:rw sys:rw cgroup:rw
      lxc.apparmor.profile = unconfined
      lxc.cap.drop =
    security:
      interceptBPF: true
      interceptBPFDevices: true
      nesting: true
      privileged: true
  source:
    endpoint: https://nixos.bioskop:8443
    project: rke2lab
