---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: LXCMachineTemplate
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-workload
  name: bioskop-wrkld-worker
  namespace: rke2lab-bioskop-wrkld
spec:
  template:
    spec:
      config:
        linux.kernel_modules: "ip_vs,ip_vs_rr,ip_vs_wrr,ip_vs_sh,netlink_diag,nf_nat,overlay,br_netfilter,xt_socket"
        raw.lxc: |-
          lxc.mount.auto = proc:rw sys:rw cgroup:rw
          lxc.apparmor.profile = unconfined
          lxc.cap.drop =
        security.nesting: "true"
        security.privileged: "true"
        security.syscalls.intercept.bpf: "true"
        security.syscalls.intercept.bpf.devices: "true"
      image:
        fingerprint: f3a4c1f5d2149770c0a5e601224ebeee3ebe5a920a5ad75f56ca730028b50a84
      instanceType: container
      profiles:
      - rke2lab
