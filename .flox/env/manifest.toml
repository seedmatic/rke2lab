schema-version = "1.10.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
pulumi.pkg-path = "pulumi-bin"
pulumictl.pkg-path = "pulumictl"
cdk8s-cli.pkg-path = "cdk8s-cli"
dasel.pkg-path = "dasel"
graphviz.pkg-path = "graphviz"
## bats: suites de tests pour les scripts shell de .claude/bin (gardes de session).
## Entrée de catalogue simple — PAS un ref de flake : rien ne couple bats à une version du
## réacteur, contrairement à shfmt que spotless vérifie.
bats.pkg-path = "bats"
## incus client, for both the Darwin shells (where we run `incus exec master`) and the Linux
## NixOS VM. DEFINED IN ndh, which owns the incus daemon's NixOS modules and the operator's trust
## to it; the flake ref below is rke2lab RE-EXPORTING it. Why a client-only build at all, and why
## not a flox catalog entry, is documented once at ndh's `incus-client` package — not restated here.
##
## Reference the github repo (not `path:.`) so the lock pins to a commit
## SHA portable across machines. `path:.` would bake the dev-machine
## absolute path into manifest.lock and break flox activate on the NixOS
## image-builder host (which only sees the repo via NFS at a different
## absolute path).
##
## Pinned to the DEFAULT branch, like jdk25/maven/shfmt/shellcheck below. These three used to track a
## working branch so the dev loop saw a change before it merged; `feature/viewpoint-separation` has
## since merged and been deleted, so they drop the branch together — exactly what the note they
## carried said would happen at merge. rke2lab's own flake calls this form the intended one: "this end
## keeps the `.#incus-client` output name so the flox manifest's
## `incus-client.flake = "github:seedmatic/rke2lab#incus-client"` and its lock stay valid".
##
## ⚠️ A branch pin here ROTS SILENTLY, and it did TWICE. First all three tracked
## `feature/nixos-node-substrate` long after it was retired (measured 2026-09-29; ndh's flake.nix
## carries the same lesson for its own rke2lab input, where `nix flake update` kept advancing along
## that dead branch). Then all three tracked `feature/viewpoint-separation` after ITS deletion
## (measured 2026-10-06 — `git ls-remote` shows no such head, while the lock still resolved a commit
## from it). Neither time was there an error: just the wrong binary, built from a line nobody is on.
## Being branch-less is the fix, not a preference — a default-branch ref cannot name something that
## has been deleted.
##
## There is NO command-line override for a flox flake ref — `flox activate` takes only
## --dir/--reference/--mode/--generation and `flox upgrade` takes no ref — so unlike a nix flake input
## (`--override-input`), the manifest is the ONLY lever. If a working branch is ever pinned here
## again, its rename must land HERE, in the same change as the branch it names.
incus-client.flake = "github:seedmatic/rke2lab#incus-client"

## Maven-build toolchain consumed from the rke2lab flake, which is the single
## source of truth (see `mavenToolchain` / `devShells.default` in flake.nix).
## Pinned here so the dev loop is deterministic and identical to the nix store
## build: same jdk25, shfmt, shellcheck versions. (Maven itself comes from the
## `./mvnw` wrapper, so it is not pinned here.) These top-level entries take
## precedence over the unpinned `pkg-path` copies the fleet `flox/jdk` and
## `flox/shell` includes would otherwise supply, and keep the dev loop's shfmt
## matched to the Maven spotless gate (`<shfmt.version>` in pom.xml). Same
## `github:` (not `path:.`) rationale as incus-client above; bump with
## `flox upgrade` after pushing flake changes.
jdk25.flake = "github:seedmatic/rke2lab#jdk25"
jdk25.priority = 1
maven.flake = "github:seedmatic/rke2lab#maven"
shfmt.flake = "github:seedmatic/rke2lab#shfmt"
shellcheck.flake = "github:seedmatic/rke2lab#shellcheck"
claude-code.pkg-path = "claude-code"
flux9s.flake = "github:seedmatic/rke2lab#flux9s"
# ndh's manage-tailnet on PATH, so the incus GROW's local.Command prunes stale
# tailscale devices on a plain `pulumi up` (not only via `nix run .#deploy`).
# darwin-only: ndh exposes the package for aarch64-darwin (the operator host) alone.
manage-tailnet.flake = "github:seedmatic/rke2lab#manage-tailnet"
manage-tailnet.systems = ["aarch64-darwin"]
k9s.pkg-path = "k9s"
tektoncd-cli.pkg-path = "tektoncd-cli"
clusterctl.pkg-path = "clusterctl"
flox-mcp-server.pkg-path = "flox/flox-mcp-server"
flox-mcp-server.pkg-group = "flox-mcp-server"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
  PULUMI_CONFIG_PASSPHRASE=''
  PULUMI_HOME='${XDG_STATE_HOME:-$HOME/.local/state}/pulumi'
  PULUMI_BACKEND_URL='file://${FLOX_ENV_PROJECT}/.pulumi-state'
  GITHUB_OWNER='seedmatic'
  M2_REPO="${HOME}/.m2/repository"


# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
## ⓘ The flake-input registry indirection used to be written out here, by hand. It now lives in
## fleet's `nix` env, included below — the logic was identical in every seat and only
## `$FLOX_ENV_PROJECT` differed, so a copy per repo was a copy that could drift. And half the
## seedmatic repos with a flake had no seat at all, which made a per-seat hook structurally
## unable to be uniform.
on-activate = """
  mkdir -p "${PULUMI_HOME}"
  mkdir -p "${FLOX_ENV_PROJECT}/.pulumi-state"
  if command -v javac >/dev/null 2>&1; then
    export JAVA_HOME="$(dirname "$(dirname "$(command -v javac)")")"
  fi
  if command -v gh >/dev/null 2>&1 && [ -z "${GH_TOKEN:-}" ]; then
    export GH_TOKEN="$(gh auth token 2>/dev/null)"
  fi
  export KUBECONFIG="${FLOX_ENV_PROJECT}/.local.d/kubeconfig.yaml"
"""


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
  environments = [
    ## The docs toolchain: asciidoctor-with-extensions + mermaid-cli, and the profile hook
    ## that points puppeteer at a cached headless shell. Included rather than restated here
    ## — the fleet env is where a SHARED toolchain lives, and `docs/` is rendered from more
    ## repos than this one. The doc-standards skill's validation gate depends on it.
    ## `.flox-envs.d/` is fleet's env tree vendored in as a git subtree, so these paths stay
    ## inside the worktree. They used to reach a symlink in the PARENT directory, which made
    ## where a worktree may live a precondition of activating it.
    { dir = "./.flox-envs.d/asciidoc" },
    { dir = "./.flox-envs.d/git" },
    { dir = "./.flox-envs.d/jdk" },
    { dir = "./.flox-envs.d/k8s" },
    { dir = "./.flox-envs.d/keyhole" },
    ## `nix` carries the flake-input registry indirection — the hook that puts this repo's
    ## `flake-registry.json`, or the gitignored `flake-registry.local.json` when one is present,
    ## into nix's GLOBAL registry slot. It is what makes `url = "ndh"` resolvable and re-aimable
    ## by a LOCAL edit. It replaces the copy this seat's own [hook] used to carry.
    { dir = "./.flox-envs.d/nix" },
    { dir = "./.flox-envs.d/pulumi" },
    { dir = "./.flox-envs.d/shell" },
  ]


