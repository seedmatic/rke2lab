config:
  rke2lab:cluster:
    # Identity atoms — the cluster name is DERIVED <host>-<role> (bioskop-mgmt), never written here.
    # host = the incus substrate the nodes grow on; role = mgmt|wrkld. remoteIncus is the ONE place
    # the <host>-nixos incus remote label is spelled (a mgmt cluster grows a workload on another
    # host's remote, so it is explicit, not decomposed).
    host: bioskop
    role: mgmt
    remoteIncus: bioskop-nixos
  rke2lab:node:
    name: master
  rke2lab:profile:
    name: rke2lab
  rke2lab:logging:
    level: debug # info,warn,debug 
  rke2lab:incus:
    project: rke2lab
    # ~ expands to the operator's home at load time, so the same value resolves
    # per-host (/Users/<user> on bioskop, /Volumes/user-home on nikopol).
    configDir: ~/.config/incus
    # The SAME endpoint `incus remote` uses (the tailnet MagicDNS bare name), NOT the mDNS
    # <host>.local default: the Go incus provider does not resolve .local reliably (the CLI does via
    # Bonjour), which broke the Image upload with "Unable to connect to bioskop-nixos.local:8443".
    remoteAddress: https://bioskop-nixos:8443
  rke2lab:image:
    alias: control-node
    sharedFolder: .local.d/images
  rke2lab:network:
    lanBridgeParent: lan-br
    vmnetNetworkName: vmnet-br
  # rke2lab:api:
  #   endpoint: https://{netplan.vipHost}:6443
  # rke2lab:systemd:
  #   dbusHost: "{cluster}-{node.name}"
  #   dbusPort: "12434"
  rke2lab:manifests:
    # The WHOLE rke2lab:manifests subtree is contributed verbatim as the manifests FACET amendment
    # (FacetContributor in ClusterSeedScenario → ManifestsAmendReflector → ManifestsRunbookInput
    # .facets), so publish / debug / delivery all reach the synthesis scion.
    publish:
      gitops: "true"
      networking: "true"
      clusterApi: "true"
      storage: "true"
      mesh: "true"
      highAvailability: "true"
      cicd: "true"
    debug:
      mesh:
        enabled: "false"
      networking:
        enabled: "false"
      nriPlugins:
        flox:
          enabled: "false"
    # Arms the force-push of the rendered tree to manifests/<clusterId> at the end of synthesis
    # (needs the sealed GitHub App token, contents:write). Default off = render + signed commit stay
    # LOCAL until armed; set "false" to return to a local-only render (then push by hand).
    delivery:
      push: "true"
    # The workload clusters this management render emits CAPI CRs for (model B — the CRs live on
    # manifests/<host>-mgmt where CAPI runs). clusterName = <host>-<role>; the CR-set unit derives
    # each target's blueprint + pins the node-base image. Only rendered at an operator grow (needs
    # the incus scion's ImageState).
    workloadTargets:
      - host: bioskop
        role: wrkld
  rke2lab:policy:
    network:
      lan:
        binding:
          enabled: "true"
    gitDirtyCheck:
      enabled: "false"
    readiness:
      override:
        systemd-adapter: warning
    # Preview-only fault simulation (ignored during `pulumi up`). Uncomment to order a
    # fake incident and get its runbook from `pulumi preview` without touching infra.
    # Failure-kinds: connection-refused, timeout.
    # preview:
    #   simulate:
    #     systemd-adapter: connection-refused
  # rke2lab:readiness:
  #   enabled: "true"
  #   timeout: PT1M
  rke2lab:entryGate:
    cleanWorktree:
      required: "false"
  rke2lab:bbox:
    # The router contact (uri + password) is joined from .secrets:lan.bbox by BboxConfig's
    # @SecretJoin — the merge directive lives on the record, not here. This section carries only
    # the reconcile policy; ConfigLoader deep-merges the secret subtree at bind time.
    reconcile:
      failOnError: "true"
  rke2lab:hostAsset:
    rotationRetentionCount: "3"
