apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-vcluster
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: networking-cilium-config
    - name: vcluster-namespace
    - name: vcluster-vcluster-certs
    - name: vcluster-vcluster-pin
  force: true
  interval: 5m
  path: ./workloads/vcluster/vcluster
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
