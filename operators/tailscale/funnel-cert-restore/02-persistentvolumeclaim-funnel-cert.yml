---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: tailscale
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: funnel-cert-restore
  name: funnel-cert
  namespace: tailscale-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 16Mi
  storageClassName: openebs-zfs-persist
  volumeName: funnel-cert
