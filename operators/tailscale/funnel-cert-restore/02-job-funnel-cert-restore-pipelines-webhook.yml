---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: tailscale
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: funnel-cert-restore
  name: funnel-cert-restore-pipelines-webhook
  namespace: tailscale-system
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        flox.seedmatic.io/environment.mirror: toolchains/kube
    spec:
      containers:
      - command:
        - bash
        - -c
        - |
          set -euo pipefail
          mkdir -p /persist/pipelines-webhook
          if [ ! -e /persist/pipelines-webhook/state.yaml ] && [ -s /persist/state.yaml ]; then
            echo "migrating legacy flat /persist/state.yaml -> /persist/pipelines-webhook/state.yaml"
            mv /persist/state.yaml /persist/pipelines-webhook/state.yaml
          fi

          if [ -s /persist/pipelines-webhook/state.yaml ]; then
            echo "restoring saved tailscale funnel state into ts-pipelines-webhook-state"
            # Strip the embedded metadata.namespace: a backup captured under a PRIOR namespace (the
            # persist PV is Retain, so it survives a namespace rename like ingress-system ->
            # tailscale-system) would otherwise make `kubectl apply -n tailscale-system` fail "namespace from the
            # provided object does not match". Namespace-agnostic — the apply -n places it correctly.
            yq 'del(.metadata.namespace)' /persist/pipelines-webhook/state.yaml | kubectl apply -n tailscale-system -f -
          else
            echo "no saved funnel state for pipelines-webhook on the persist volume — clean first grow"
          fi
        image: rke2lab/flox-carrier:0.1.0
        name: mirror
        volumeMounts:
        - mountPath: /persist
          name: persist
      restartPolicy: OnFailure
      serviceAccountName: funnel-cert-restore
      volumes:
      - name: persist
        persistentVolumeClaim:
          claimName: funnel-cert
