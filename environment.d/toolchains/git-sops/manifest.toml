# The sops toolchain for a step that works on the sops tree: git + sops + yq + a shell.
# The in-cluster render pipeline activates it so the render opens `.secrets` and seals the
# Secrets it commits to manifests/<cluster>, both in memory — no git filter is wired, so a
# checkout leaves the sops files encrypted and nothing is encrypted at `git add`.
#
# The age key is NOT here: the FloxEnv's spec.inject contributes SOPS_AGE_KEY from the
# replicated `sops-age` Secret (the cluster age key, a recipient of `.secrets`).
schema-version = "1.10.0"

[install]

  [install.git]
  pkg-path = "git"

  [install.sops]
  pkg-path = "sops"

  # mikefarah yq.
  [install.yq-go]
  pkg-path = "yq-go"

  [install.bash]
  pkg-path = "bash"
  outputs = "all"

  [install.coreutils]
  pkg-path = "coreutils"
  outputs = "all"

[options]
systems = ["aarch64-linux"]
