# The ssh fallback to GitHub, for when the HTTPS token or two-factor fails. Every
# remote is HTTPS; this path is the spare.
#
# IdentitiesOnly: offer github-authentication and nothing else. Without it ssh
# offered every key in the agent, and whichever GitHub happened to recognise got
# in — including the signing keys, registered for both roles.
Host github.com
    User git
    IdentityFile @sshKeysDir@/github-authentication
    IdentitiesOnly yes
