apiVersion: cluster.seedmatic.io/v1alpha1
kind: NodeImage
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-management
  name: nikopol-mgmt-node-agent
  namespace: rke2lab-nikopol-mgmt
spec:
  alias: node-agent
  buildChecksum: 0ab94d23539677d1f730f357ea7a988d276c92c82c1cdf6c66f872971d06e981
  fingerprint: 0c7a40692ea8a9d561b6f7b2b8c1453c46db5d70278b49eaadca55126cd88552
  rke2Version: v1.37.1+rke2r1
  runtime:
    kernelModules:
      - ip_vs
      - ip_vs_rr
      - ip_vs_wrr
      - ip_vs_sh
      - netlink_diag
      - nf_nat
      - overlay
      - br_netfilter
      - xt_socket
      - xfrm_user
      - nft_compat
      - xt_mark
      - xt_CT
      - xt_TPROXY
      - xt_comment
      - xt_conntrack
    rawLXC: |-
      lxc.mount.auto = proc:rw sys:rw cgroup:rw
      lxc.apparmor.profile = unconfined
      lxc.cap.drop =
    security:
      interceptBPF: true
      interceptBPFDevices: true
      nesting: true
      privileged: true
  source:
    endpoint: https://nixos.bioskop:8443
    project: rke2lab
