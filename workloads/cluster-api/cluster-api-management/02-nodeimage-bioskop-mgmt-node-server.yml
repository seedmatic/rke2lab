apiVersion: cluster.seedmatic.io/v1alpha1
kind: NodeImage
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-management
  name: bioskop-mgmt-node-server
  namespace: rke2lab-bioskop-mgmt
spec:
  alias: node-server
  buildChecksum: 3e401cde2005c9da7a7866cc402a030932d262bbc3e54301ad6722282c0b843d
  fingerprint: 1fe16566ebe4635568440f96e7f8a9ba686d5c52c71b8c0a53bf92e5fa325d9f
  rke2Version: v1.37.1+rke2r1
  runtime:
    kernelModules:
      - ip_vs
      - ip_vs_rr
      - ip_vs_wrr
      - ip_vs_sh
      - netlink_diag
      - nf_nat
      - overlay
      - br_netfilter
      - xt_socket
      - xfrm_user
      - nft_compat
      - xt_mark
      - xt_CT
      - xt_TPROXY
      - xt_comment
      - xt_conntrack
    rawLXC: |-
      lxc.mount.auto = proc:rw sys:rw cgroup:rw
      lxc.apparmor.profile = unconfined
      lxc.cap.drop =
    security:
      interceptBPF: true
      interceptBPFDevices: true
      nesting: true
      privileged: true
  source:
    endpoint: https://nixos.bioskop:8443
    project: rke2lab
