---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: runtime
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: flox-webhook
  name: flox-controller-webhook-serving
  namespace: rke2lab-system
spec:
  dnsNames:
  - flox-controller-webhook.rke2lab-system.svc
  - flox-controller-webhook.rke2lab-system.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: rke2lab-ca
  secretName: flox-controller-webhook-tls
