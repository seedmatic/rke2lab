apiVersion: flox.seedmatic.io/v1alpha1
kind: FloxEnv
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: runtime
    io.seedmatic.rke2lab/package: flox-envs
  name: git-sops
  namespace: rke2lab-system
spec:
  consumption: overlay
  folder: toolchains
  inject:
    - name: SOPS_AGE_KEY
      secretKeyRef:
        key: age.agekey
        name: sops-age
        optional: true
  manifest:
    install:
      bash:
        flake: floxcatalog:catalog#bash
      coreutils:
        flake: floxcatalog:catalog#coreutils
      git:
        flake: floxcatalog:catalog#git
      sops:
        flake: floxcatalog:catalog#sops
      yq-go:
        flake: floxcatalog:catalog#yq-go
    options:
      systems:
        - aarch64-linux
    schema-version: 1.10.0
