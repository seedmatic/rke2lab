---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runtime-flox-envs
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: cluster-runtime-system-namespace-foundation
  - name: cluster-runtime-system-namespace-workloads
  - name: runtime-flox-catalog-operators
  - name: runtime-flox-catalog-workloads
  - name: runtime-flox-controller-crds
  force: true
  interval: 5m
  path: ./workloads/runtime/flox-envs
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
