---
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: storage
    io.seedmatic.rke2lab/package: openebs-zfs
  name: openebs-zfs-shared
parameters:
  fstype: zfs
  poolname: tank/rke2lab/control-nodes/master
  shared: "yes"
provisioner: zfs.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
