---
apiVersion: cluster.seedmatic.io/v1alpha1
kind: PoolIntention
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/package: cluster-api-workload
  name: bioskop-wrkld-control-node
  namespace: rke2lab-bioskop-wrkld
spec:
  clusterRef: bioskop-wrkld
  controlPlaneEndpoint:
    host: 10.80.15.10
    port: 6443
  devices:
  - "root,type=disk,path=/,pool=default"
  - "kmsg.dev,type=unix-char,source=/dev/kmsg,path=/dev/kmsg"
  - "zfs.dev,type=unix-char,source=/dev/zfs,path=/dev/zfs"
  - "fabric0,type=nic,name=fabric0,nictype=bridged,parent=fabric-br"
  - "vmnet0,type=nic,name=vmnet0,nictype=bridged,parent=vmnet-wrkld"
  image:
    name: bioskop-wrkld-node-base
  namespace: rke2lab-bioskop-wrkld
  nature: cattle
  nodeLabels:
  - flox.seedmatic.io/enabled=true
  nodes:
  - name: bioskop-wrkld-master
  - name: bioskop-wrkld-peer1
  - name: bioskop-wrkld-peer2
  pool: control-node
  replicas: 3
  rke2Version: v1.34.10+rke2r1
  role: control-plane
  target: bioskop-nixos
