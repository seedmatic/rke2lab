---
apiVersion: v1
data:
  extra_records.json: |-
    [
      {
        "name": "headscale.hs.net",
        "type": "A",
        "value": "${cluster-lan-headscale-inetaddr}"
      },
      {
        "name": "headplane.hs.net",
        "type": "A",
        "value": "${cluster-lan-headplane-inetaddr}"
      }
    ]
kind: ConfigMap
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: mesh
    io.seedmatic.rke2lab/package: headscale
  name: headscale-extra-records
  namespace: mesh-system
