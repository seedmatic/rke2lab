---
apiVersion: cluster.seedmatic.io/v1alpha1
kind: VolumeIntention
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: tailscale
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: funnel-cert-restore
  name: funnel-cert
  namespace: tailscale-system
spec:
  capacity: 16Mi
  claimRef:
    name: funnel-cert
    namespace: tailscale-system
  dataset: funnel-cert
  nodeRole: control-plane
  pool: tank/rke2lab/wrkld/persist
  storageClassName: openebs-zfs-persist
