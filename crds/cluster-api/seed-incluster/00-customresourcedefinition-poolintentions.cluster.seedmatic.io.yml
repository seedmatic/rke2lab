---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    io.seedmatic.rke2lab/domain: cluster-api
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: seed-incluster
  name: poolintentions.cluster.seedmatic.io
spec:
  group: cluster.seedmatic.io
  names:
    kind: PoolIntention
    listKind: PoolIntentionList
    plural: poolintentions
    shortNames:
    - capipool
    singular: poolintention
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .spec.pool
      name: Pool
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PoolIntention is the Flux-owned pool-level intent for one node pool of a cluster — reconciled
          adopt-first by the controller, which owns the derived PoolAdoption.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PoolIntentionSpec is the POOL-LEVEL intent seed-master renders for one node pool of a cluster —
              the Flux-owned recipe for the pool's CAPI template shape (RKE2ControlPlane for a control-plane
              pool, MachineDeployment + RKE2ConfigTemplate for a worker pool) + its LXCMachineTemplate + its
              named pets. A cluster has N PoolIntentions (one per pool), each ownerRef'd to the ClusterIntention.
              The controller reconciles each adopt-first and OWNS a PoolAdoption (the pool mirror). The
              cluster-level facts (image, versions, VIP) are DUPLICATED here from the same blueprint SSOT so the
              pool reconcile is decoupled from the cluster reconcile.
            properties:
              clusterRef:
                description: |-
                  ClusterRef is the name of the owning ClusterIntention (= its clusterName). The CAPI objects
                  this pool builds reference the cluster by the deterministic name, so there is no runtime dep —
                  just the naming convention (<cluster>, <cluster>-control-plane).
                minLength: 1
                type: string
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the kube-vip VIP — a control-plane pool registers its replicas on it.
                properties:
                  host:
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - host
                - port
                type: object
              image:
                description: Image pins the nix-built node-base the pool's LXCMachines boot on / adopt.
                properties:
                  fingerprint:
                    minLength: 1
                    type: string
                required:
                - fingerprint
                type: object
              kubeVIPVersion:
                description: |-
                  KubeVIPVersion pins the kube-vip image a control-plane pool's bootstrap deploys (ignored by
                  worker pools).
                type: string
              namespace:
                description: "Namespace is where the CAPI CR-set, the owned PoolAdoption, and the referenced Secrets live."
                minLength: 1
                type: string
              nodes:
                description: "Nodes is the pool's explicit pet roster, adopted/provisioned by providerID (lxc:///<name>)."
                items:
                  description: |-
                    PetSpec is one named pet of a pool — the deterministic instance name (CANONICAL_NODE_NAMES), the
                    providerID basis (lxc:///<name>) and the LXCMachine object name CAPN matches the running instance
                    against. No cattle / no replica count: a named pet is the only shape that re-matches its survivor
                    after a cold-start.
                  properties:
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              pool:
                description: |-
                  Pool is the pool identity (e.g. "control-node", "gpu-node"). It names the LXCMachineTemplate
                  and (for workers) the MachineDeployment; the CAPI TREATMENT is Role, not this name.
                minLength: 1
                type: string
              rke2Version:
                description: "RKE2Version is the CAPRKE2 version for this pool (control-plane RCP, or worker RKE2ConfigTemplate)."
                minLength: 1
                type: string
              role:
                description: Role is the CAPI treatment this pool derives (control-plane vs worker).
                enum:
                - control-plane
                - worker
                type: string
            required:
            - clusterRef
            - controlPlaneEndpoint
            - image
            - namespace
            - nodes
            - pool
            - rke2Version
            - role
            type: object
          status:
            description: PoolIntentionStatus records what the controller observed.
            properties:
              adoptionRef:
                description: AdoptionRef is the name of the PoolAdoption this PoolIntention owns (in Namespace).
                type: string
              conditions:
                description: Conditions follow the standard metav1.Condition contract.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                      type: string
                    status:
                      description: "status of the condition, one of True, False, Unknown."
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled this PoolIntention.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status reflects.
                format: int64
                type: integer
              phase:
                description: Phase mirrors the owned PoolAdoption per-pool state machine phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
