---
apiVersion: flox.seedmatic.io/v1alpha1
kind: FloxEnv
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: runtime
    io.seedmatic.rke2lab/package: flox-envs
  name: tailnet
  namespace: rke2lab-system
spec:
  consumption: overlay
  folder: mesh
  manifest:
    install:
      bash:
        outputs: all
        pkg-path: bash
      coreutils:
        outputs: all
        pkg-path: coreutils
      manage-tailnet:
        flake: floxcatalog:catalogue#manage-tailnet
      yq-go:
        outputs: all
        pkg-path: yq-go
    options:
      systems:
      - aarch64-linux
    schema-version: 1.10.0
