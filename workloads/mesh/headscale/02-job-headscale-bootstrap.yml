---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: mesh
    io.seedmatic.rke2lab/package: headscale
  name: headscale-bootstrap
  namespace: mesh-system
spec:
  template:
    metadata:
      annotations:
        flox.seedmatic.io/environment.bootstrap: mesh/headscale
        io.seedmatic.rke2lab/domain: mesh
        io.seedmatic.rke2lab/package: headscale
    spec:
      containers:
      - command:
        - /scripts/bootstrap.sh
        envFrom:
        - configMapRef:
            name: headscale-env
        image: rke2lab/flox-carrier:0.1.0
        name: bootstrap
        resources:
          limits:
            cpu: 250m
            ephemeral-storage: 256Mi
            memory: 256Mi
          requests:
            cpu: 50m
            ephemeral-storage: 64Mi
            memory: 64Mi
        volumeMounts:
        - mountPath: /scripts
          name: bootstrap-script
          readOnly: true
      restartPolicy: OnFailure
      serviceAccountName: headscale-bootstrap
      volumes:
      - configMap:
          defaultMode: 493
          name: headscale-bootstrap-script
        name: bootstrap-script
  ttlSecondsAfterFinished: 300
